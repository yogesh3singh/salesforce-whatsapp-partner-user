name: Salesforce CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth_url.txt
          sf org login sfdx-url \
            --sfdx-url-file ./auth_url.txt \
            --alias HikeProd
          rm ./auth_url.txt

      - name: Verify structure
        run: ls -la force-app/main/default/

      - name: Validate with specific test
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --test-level RunSpecifiedTests \
            --tests WACommunityControllerTest \
            --target-org HikeProd

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > ./auth_url.txt
          sf org login sfdx-url \
            --sfdx-url-file ./auth_url.txt \
            --alias HikeProd
          rm ./auth_url.txt

      - name: Deploy with specific test
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunSpecifiedTests \
            --tests WACommunityControllerTest \
            --target-org HikeProd